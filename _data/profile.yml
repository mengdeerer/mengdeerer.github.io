short_bio: >-
  <p>
    I am a first-year master's student at Shanghai Jiao Tong University, advised by <a href="https://guolusjtu.github.io/guoluhomepage/" target="_blank" rel="noopener noreferrer">Prof. Guo Lu</a>.
    I received my bachelor's degree in Information Engineering from the same university.
  </p>
  <p>
    My research focuses on <strong>omni-modal models</strong>, with an emphasis on integrating vision, audio, and language for natural, real-time interaction.
    I am particularly interested in how these models can perceive, reason, and act throughout an ongoing conversation.
    My previous work explored efficient video understanding through spatiotemporal token compression.
  </p>
  <p>
    I am also a research intern at <strong>StepFun</strong>, working on audio-language model post-training.
    I contributed to <a href="https://arxiv.org/abs/2609.14005" target="_blank" rel="noopener noreferrer">StepAudio 3 Realtime</a>, primarily in <strong>full-duplex dialogue</strong> and <strong>voice agent capabilities</strong>.
    This work aligns with my broader interest in building multimodal assistants that interact naturally and carry out tasks through conversation.
  </p>

